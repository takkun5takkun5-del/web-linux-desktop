<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Browser Desktop</title>
    <script src="https://copy.sh/v86/build/v86_all.js"></script>
    <style>
        body { background-color: #222; color: #fff; text-align: center; font-family: sans-serif; }
        #screen_container { margin: 20px auto; display: inline-block; border: 2px solid #666; }
    </style>
</head>
<body>
    <h1>Browser OS Desktop</h1>
<p>このサイトはWebAssembly技術を活用した、HTML5ベースのWebプログラミング学習・動作検証用ページです。</p>
    <div id="screen_container">
        <div style="white-space: pre; font-family: monospace"></div>
        <canvas></canvas>
    </div>

    <script>
    window.onload = function() {
        var emulator = new V86Starter({
            wasm_path: "https://copy.sh/v86/build/v86.wasm",
            memory_size: 512 * 1024 * 1024,
            vga_memory_size: 8 * 1024 * 1024,
            screen_container: document.getElementById("screen_container"),
            bios: { url: "https://copy.sh/v86/bios/seabios.bin" },
            vga_bios: { url: "https://copy.sh/v86/bios/vgabios.bin" },
            cdrom: { url: "https://copy.sh/v86/images/kolibrios.iso" },
            autostart: true,
        });
    };
    </script>
</body>
</html>
